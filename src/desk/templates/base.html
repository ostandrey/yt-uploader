<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#070a08">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>{% block title %}Coin Wire desk{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="stylesheet" href="/static/desk.css">
</head>
<body>
{% if logged_in %}
<nav>
  <a href="/" {% if nav == 'today' %}aria-current="page"{% endif %}>Сьогодні</a>
  <a href="/stats" {% if nav == 'stats' %}aria-current="page"{% endif %}>Статистика</a>
  <form class="spacer" method="post" action="/logout">
    <button class="link" type="submit">Вийти</button>
  </form>
</nav>
{% endif %}
{% block body %}{% endblock %}
<div id="toast" role="status" aria-live="polite"></div>
{% block scripts %}{% endblock %}
</body>
</html>
