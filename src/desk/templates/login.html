{% extends "base.html" %}
{% block title %}Вхід — Coin Wire desk{% endblock %}
{% block body %}
<div class="page-wrap">
  <main class="login-main">
    <h1>Coin Wire desk</h1>
    <p class="login-sub">Оператор</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login" class="card login-card" autocomplete="on">
      <input id="username" type="text" name="username" value="desk" autocomplete="username" tabindex="-1" aria-hidden="true">
      <label for="password">Пароль</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required autofocus enterkeyhint="go">
      <button class="btn-primary" type="submit">Увійти</button>
    </form>
    <p class="pwa-hint">Додай до головного екрана для PWA</p>
  </main>
</div>
{% endblock %}
